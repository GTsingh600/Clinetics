[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinetics-backend"
version = "0.1.0"
description = "Clinetics — AI clinic scheduling agent: forecast, optimize, explain, simulate."
requires-python = ">=3.12,<3.13"

# Runtime deps for the web/API tier. Heavy scientific libs live in the `ml`
# extra so a plain API container stays small and CI lint jobs stay fast.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # [email] pulls in email-validator, needed for Pydantic's EmailStr.
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",            # async driver used by the app
    "psycopg[binary]>=3.2",     # sync driver used by Alembic
    "celery>=5.4",
    "redis>=5.2",
    "python-jose[cryptography]>=3.3",  # JWT (Phase 2 auth)
    # bcrypt directly, NOT passlib: passlib is unmaintained and reads
    # `bcrypt.__about__`, removed in bcrypt 4.1, so it fails against bcrypt 5.
    # See app/core/security.py.
    "bcrypt>=4.2",
    "anthropic>=0.40",                # agent tool-calling (Phase 5)
]

[project.optional-dependencies]
ml = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "ortools>=9.11",
    "faker>=30.0",
    "matplotlib>=3.9",   # Phase 1 validation-gate plots
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",       # FastAPI TestClient transport
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "locust>=2.32",      # Phase 7 load test
]

# Flat layout with three top-level packages, so auto-discovery is ambiguous.
# Declaring them explicitly keeps `uv pip install -e .` working.
[tool.setuptools.packages.find]
include = ["app*", "forecasting*", "optimizer*"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "TID",      # tidy imports
    "RUF",
]
ignore = [
    "E501",  # line length is Black's job
    "B008",  # FastAPI's Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E402", "F401", "N999"]
"tests/*" = ["S101"]
# N803/N806: a capital `X` for a design matrix and lowercase `y` for the target
# is universal notation in machine learning -- it is scikit-learn's own API
# signature. Renaming to `x` here would make this code read as unlike every ML
# reference a reviewer knows. The exception is scoped to the modelling code
# rather than applied globally.
"forecasting/*" = ["N803", "N806"]
"scripts/train_models.py" = ["N803", "N806"]
"scripts/evaluate.py" = ["N803", "N806"]
"scripts/ceiling_analysis.py" = ["N803", "N806"]
"app/services/inference_service.py" = ["N803", "N806"]
"tests/unit/test_models.py" = ["N803", "N806"]
"tests/unit/test_no_leakage.py" = ["N803", "N806"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
# Third-party libs without stubs; tighten as the project grows.
[[tool.mypy.overrides]]
module = ["celery.*", "jose.*", "bcrypt.*", "ortools.*", "lightgbm.*", "xgboost.*", "sklearn.*", "matplotlib.*", "faker.*", "pandas.*", "scipy.*", "joblib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["alembic.versions.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Every async fixture shares the test's own loop. Async DB fixtures are
# function-scoped precisely so this stays true; see tests/conftest.py.
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a live Postgres/Redis (skipped by default in unit runs)",
    "slow: long-running (optimizer benchmarks, load tests)",
]
